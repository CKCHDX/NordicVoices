<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NordicVoices | Rule-Based Engine</title>
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: #111;
            --border: #333;
            --accent: #00ff9d; /* Cyberpunk Green */
            --text-main: #eee;
            --text-dim: #777;
        }
        body { margin: 0; font-family: 'Courier New', monospace; background: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* Terminal / Cyberpunk Aesthetic */
        .interface { width: 95%; max-width: 1000px; margin-top: 50px; border: 1px solid var(--border); box-shadow: 0 0 20px rgba(0, 255, 157, 0.1); background: var(--panel-bg); padding: 2px; }
        
        header { background: #000; padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 1.2rem; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
        .status { font-size: 0.8rem; color: var(--text-dim); }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--border); }
        .panel { padding: 0; position: relative; }
        .panel:first-child { border-right: 1px solid var(--border); }
        
        .label { position: absolute; top: 10px; left: 15px; font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; pointer-events: none; }
        
        textarea { width: 100%; height: 300px; background: transparent; border: none; color: var(--text-main); font-family: inherit; font-size: 1rem; padding: 40px 20px 20px 20px; resize: none; box-sizing: border-box; line-height: 1.6; }
        textarea:focus { outline: none; background: rgba(0, 255, 157, 0.02); }
        
        #output { color: var(--accent); }
        
        .debug-panel { background: #000; padding: 15px; font-size: 0.8rem; color: var(--text-dim); border-top: 1px solid var(--border); min-height: 100px; max-height: 200px; overflow-y: auto; }
        .log-entry { margin-bottom: 5px; border-bottom: 1px solid #222; padding-bottom: 2px; }
        .log-entry span { color: #fff; }
        
        .controls { padding: 10px 20px; display: flex; gap: 20px; background: #080808; align-items: center; }
        label { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; cursor: pointer; color: var(--text-dim); }
        input[type="checkbox"] { accent-color: var(--accent); }
    </style>
</head>
<body>

<div class="interface">
    <header>
        <h1>NordicVoices // Pitemål Engine</h1>
        <div class="status">System: ONLINE</div>
    </header>
    
    <div class="grid">
        <div class="panel">
            <div class="label">Input Stream [Swedish]</div>
            <textarea id="input" placeholder="Initiate text sequence..." oninput="processText()"></textarea>
        </div>
        <div class="panel">
            <div class="label">Processed Output [Pitemål]</div>
            <textarea id="output" readonly></textarea>
        </div>
    </div>
    
    <div class="controls">
        <label><input type="checkbox" id="rule-apocope" checked onchange="processText()"> Apocope (Vowel Drop)</label>
        <label><input type="checkbox" id="rule-vowels" checked onchange="processText()"> Vowel Shift Matrix</label>
        <label><input type="checkbox" id="rule-consonants" checked onchange="processText()"> Consonant Transformations</label>
        <label><input type="checkbox" id="rule-morphology" checked onchange="processText()"> Morphological Patterns</label>
    </div>

    <div class="debug-panel" id="debug-log">
        <!-- Live transformation logs will appear here -->
        <div class="log-entry">Waiting for input stream...</div>
    </div>
</div>

<script>
    // --- Rule-Based Transformation Engine ---
    
    // 1. Character/Substring Replacement Rules (Ordered by priority)
    const phonologyRules = [
        // Consonant Clusters
        { regex: /sk\b/g, replace: "sch", name: "Soft SK end" }, // fisk -> fisch
        { regex: /^hv/g, replace: "v", name: "Silent H" },      // hvad -> va
        { regex: /^v/g, replace: "w", name: "Initial V -> W" }, // var -> war
        { regex: /rs\b/g, replace: "sch", name: "Retroflex RS" },
        { regex: /rd\b/g, replace: "L", name: "Thick L (rd)" }, // bord -> boL
        { regex: /rn\b/g, replace: "n", name: "Retroflex RN" }, 
        
        // Vowel Shifts
        { regex: /o/g, replace: "u", name: "O -> U shift" },    // bok -> buk (base rule)
        { regex: /a\b/g, replace: "", name: "Apocope (End A)" }, // prata -> prat
        { regex: /er\b/g, replace: "ä", name: "Ending ER -> Ä" }, // heter -> hetä -> hät? (Contextual)
        { regex: /ande\b/g, replace: "an", name: "Participle -ande -> -an" },
        
        // Specific Patterns
        { regex: /eig\b/g, replace: "ej", name: "Eig -> Ej" },
        { regex: /yg\b/g, replace: "ög", name: "Yg -> Ög" },
    ];

    // 2. Morphological Rules (Word Structure)
    const morphRules = [
        // Definite Articles (Suffixes)
        // boken -> båoka (en -> a)
        { regex: /en\b/g, replace: "a", context: "definite_noun_en" }, 
        { regex: /et\b/g, replace: "e", context: "definite_noun_et" },
        
        // Plural Verb Endings
        // (This usually requires knowing the subject, but we can do simple pattern matching)
        // We handle this via the 'Process' function logic
    ];
    
    // 3. High-Frequency "Exceptions" as Rules (Not dictionary, but Pattern Overrides)
    // We treat these as "Root Transformations"
    const rootTransforms = [
        { match: "jag", replace: "I" },
        { match: "och", replace: "å" },
        { match: "är", replace: "jär" },
        { match: "inte", replace: "int" },
        { match: "sverige", replace: "Schwerje" },
        { match: "från", replace: "frå" },
        { match: "vi", replace: "ve" },
        { match: "ni", replace: "je" },
        { match: "de", replace: "döm" }
    ];

    function log(msg) {
        const logPanel = document.getElementById('debug-log');
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = `> ${msg}`;
        logPanel.prepend(entry);
        // Keep log clean
        if (logPanel.children.length > 20) logPanel.lastChild.remove();
    }

    function processText() {
        const input = document.getElementById('input').value;
        const tokens = input.split(/(\s+|[.,!?-])/); 
        const outputField = document.getElementById('output');
        const debugPanel = document.getElementById('debug-log');
        debugPanel.innerHTML = ''; // Clear log on new type
        
        let translatedTokens = [];
        
        // Flags
        const useApocope = document.getElementById('rule-apocope').checked;
        const useVowels = document.getElementById('rule-vowels').checked;
        const useConsonants = document.getElementById('rule-consonants').checked;
        const useMorph = document.getElementById('rule-morphology').checked;

        for (let i = 0; i < tokens.length; i++) {
            let token = tokens[i];
            let original = token;
            
            // Skip non-words
            if (!token.match(/[a-zA-ZåäöÅÄÖ]/)) {
                translatedTokens.push(token);
                continue;
            }
            
            let processed = token.toLowerCase();
            let stepLog = [];

            // A. Root Override (The "Anti-Dictionary")
            // Instead of a full dict, we check for core structural roots first
            let rootFound = false;
            for (let rt of rootTransforms) {
                if (processed === rt.match) {
                    processed = rt.replace;
                    rootFound = true;
                    stepLog.push(`Root: ${rt.match}->${rt.replace}`);
                    break;
                }
            }

            if (!rootFound) {
                // B. Procedural Generation
                
                // 1. Vowel Shift (O -> U, etc)
                if (useVowels) {
                    // Logic: 'o' becomes 'u' often, but 'a' -> 'å' is complex.
                    // Let's implement the specific Westrobothnian 'a' -> 'å' before 'ng' or 'ld'
                    if (processed.match(/a(ng|ld|nd)/)) {
                        processed = processed.replace(/a(?=ng|ld|nd)/g, "å");
                        stepLog.push("Vowel: a->å (before cluster)");
                    }
                    // General O->U (simple approximation for engine)
                    // processed = processed.replace(/o/g, "u"); 
                }

                // 2. Consonant Transforms
                if (useConsonants) {
                    // Thick L rule: rd -> L, rt -> Lt
                    if (processed.includes('rd')) {
                        processed = processed.replace(/rd/g, 'L');
                        stepLog.push("Thick L: rd->L");
                    }
                    // Initial V -> W
                    if (processed.startsWith('v')) {
                        processed = "w" + processed.substring(1);
                        stepLog.push("Initial: v->w");
                    }
                }

                // 3. Morphology & Apocope (The big Pitemål feature)
                if (useApocope) {
                    // Rule: If word > 1 syllable and ends in vowel, drop it
                    // Simple syllable count heuristic (vowel groups)
                    const vowels = processed.match(/[aeiouyåäö]/g);
                    if (vowels && vowels.length > 1 && processed.match(/[a]$/)) {
                        processed = processed.slice(0, -1);
                        stepLog.push("Apocope: Drop final -a");
                    }
                }
                
                // 4. Definite Article Suffixes (Noun Morphing)
                // en boken -> n båoka
                if (useMorph) {
                    if (processed.endsWith('en')) {
                        // boken -> bok-a (simplified definite feminine/neutral logic)
                        processed = processed.replace(/en$/, 'a');
                         stepLog.push("Morph: -en -> -a");
                    }
                    if (processed.endsWith('et')) {
                        // huset -> huse
                        processed = processed.replace(/et$/, 'e');
                        stepLog.push("Morph: -et -> -e");
                    }
                }
            }

            // Restore Case
            if (token[0] === token[0].toUpperCase()) {
                processed = processed.charAt(0).toUpperCase() + processed.slice(1);
            }
            
            if (stepLog.length > 0) log(`${original}: ${stepLog.join(', ')}`);
            translatedTokens.push(processed);
        }

        outputField.value = translatedTokens.join('');
    }
</script>

</body>
</html>
