<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NordicVoices | Pitemål Engine v2.0</title>
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: #111;
            --border: #333;
            --accent: #00ff9d;
            --text-main: #eee;
            --text-dim: #777;
        }
        body { margin: 0; font-family: 'Courier New', monospace; background: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .interface { width: 95%; max-width: 1200px; margin-top: 50px; border: 1px solid var(--border); box-shadow: 0 0 20px rgba(0, 255, 157, 0.1); background: var(--panel-bg); display: flex; flex-direction: column; }
        
        header { background: #000; padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 1.2rem; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
        .status { font-size: 0.8rem; color: var(--text-dim); }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--border); flex-grow: 1; }
        .panel { padding: 0; position: relative; display: flex; flex-direction: column; }
        .panel:first-child { border-right: 1px solid var(--border); }
        
        .label { padding: 10px 15px; font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; background: #080808; border-bottom: 1px solid var(--border); }
        
        textarea { width: 100%; height: 400px; background: transparent; border: none; color: var(--text-main); font-family: inherit; font-size: 1rem; padding: 20px; resize: none; box-sizing: border-box; line-height: 1.6; flex-grow: 1; }
        textarea:focus { outline: none; background: rgba(0, 255, 157, 0.02); }
        
        #output { color: var(--accent); }
        
        .debug-panel { background: #000; padding: 15px; font-size: 0.8rem; color: var(--text-dim); border-top: 1px solid var(--border); height: 150px; overflow-y: auto; font-family: 'Consolas', monospace; }
        .log-entry { margin-bottom: 4px; border-bottom: 1px solid #1a1a1a; padding-bottom: 2px; display: flex; gap: 10px; }
        .log-orig { color: #888; width: 100px; }
        .log-trans { color: var(--accent); width: 100px; }
        .log-rule { color: #555; font-style: italic; }
        
        .controls { padding: 15px 20px; display: flex; gap: 20px; background: #080808; align-items: center; flex-wrap: wrap; }
        label { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; cursor: pointer; color: var(--text-dim); }
        input[type="checkbox"] { accent-color: var(--accent); }
    </style>
</head>
<body>

<div class="interface">
    <header>
        <h1>NordicVoices // Pitemål Engine v2.0</h1>
        <div class="status">Ruleset: AUTHENTIC</div>
    </header>
    
    <div class="grid">
        <div class="panel">
            <div class="label">Input Stream [Swedish]</div>
            <textarea id="input" placeholder="Enter text to process..." oninput="processText()"></textarea>
        </div>
        <div class="panel">
            <div class="label">Processed Output [Pitemål]</div>
            <textarea id="output" readonly></textarea>
        </div>
    </div>
    
    <div class="controls">
        <label><input type="checkbox" id="rule-particles" checked onchange="processText()"> Grammar Particles (men->män)</label>
        <label><input type="checkbox" id="rule-suffixes" checked onchange="processText()"> Smart Suffixes (-het->he)</label>
        <label><input type="checkbox" id="rule-verbs" checked onchange="processText()"> Verb Apocope (-ar->ø)</label>
        <label><input type="checkbox" id="rule-phonology" checked onchange="processText()"> Phonetic Shifts (v->w)</label>
    </div>

    <div class="debug-panel" id="debug-log">
        <div class="log-entry">System ready. Awaiting input...</div>
    </div>
</div>

<script>
    // --- Advanced Rule Engine v2.0 ---

    // 1. Grammatical Particles (Function Words)
    // High priority structural changes
    const particleRules = {
        "men": "män",
        "och": "å",
        "att": "at",
        "som": "som", // Unchanged usually
        "det": "hä", // Specific object reference
        "den": "hä",
        "de": "döm", // Subject "they" (careful with "the")
        "vi": "ve",
        "ni": "je",
        "du": "dö",
        "dig": "dä",
        "mig": "mä",
        "sig": "sä",
        "från": "frå",
        "med": "wä",
        "till": "täll",
        "utan": "utan",
        "vid": "ve",
        "vem": "väm",
        "vad": "vo",
        "hur": "vöre",
        "sverige": "Schwerje",
        "teknologin": "teknologin", // Keep technical terms often
        "liv": "liv",
        "mycket": "myttje"
    };

    // 2. Suffix Transformations (Morphology)
    const suffixRules = [
        { suffix: "het", replace: "he", name: "-het -> -he" }, // osäkerhet -> osäkerhe
        { suffix: "heten", replace: "he", name: "-heten -> -he" },
        { suffix: "nad", replace: "na", name: "-nad -> -na" }, // marknad -> markna
        { suffix: "ande", replace: "an", name: "-ande -> -an" },
        { suffix: "ning", replace: "ning", name: "-ning (keep)" },
        { suffix: "tion", replace: "tion", name: "-tion (keep)" },
        { suffix: "en", replace: "n", name: "-en -> -n (Definite)" }, // bilen -> biln (simplified)
        { suffix: "et", replace: "e", name: "-et -> -e (Definite)" }  // huset -> huse
    ];

    // 3. Phonological patterns (Regex)
    const phonologyRules = [
        { regex: /^v/, replace: "w", name: "Initial V->W" }, // var -> war
        { regex: /sk\b/, replace: "sch", name: "Soft SK end" },
        { regex: /rd\b/, replace: "L", name: "Thick L (rd)" },
        { regex: /rt\b/, replace: "Lt", name: "Thick L (rt)" },
        { regex: /rn\b/, replace: "Rn", name: "Thick N (rn)" },
        { regex: /o(?=[bdfgklmnpstv])/, replace: "u", name: "O->U (mid-word)" }, // General rule
        { regex: /a(?=ng|nk)/, replace: "å", name: "A->Å (before nk/ng)" }
    ];

    function log(original, translated, rule) {
        const logPanel = document.getElementById('debug-log');
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = `<div class="log-orig">${original}</div><div class="log-trans">${translated}</div><div class="log-rule">${rule}</div>`;
        logPanel.prepend(entry);
        if (logPanel.children.length > 50) logPanel.lastChild.remove();
    }

    function processText() {
        const input = document.getElementById('input').value;
        const tokens = input.split(/(\s+|[.,!?:;-])/); // Preserve all delimiters
        const outputField = document.getElementById('output');
        document.getElementById('debug-log').innerHTML = ''; // Clear log
        
        // Settings
        const useParticles = document.getElementById('rule-particles').checked;
        const useSuffixes = document.getElementById('rule-suffixes').checked;
        const useVerbs = document.getElementById('rule-verbs').checked;
        const usePhono = document.getElementById('rule-phonology').checked;

        let processedTokens = tokens.map(token => {
            if (!token.match(/[a-zA-ZåäöÅÄÖ]/)) return token; // Skip non-words

            let original = token;
            let word = token.toLowerCase();
            let appliedRule = "Raw";

            // A. Particle Check (Exact match)
            if (useParticles && particleRules[word]) {
                word = particleRules[word];
                appliedRule = "Particle";
            } else {
                // B. Verb Apocope (Present Tense -ar)
                // Rule: If ends in -ar and > 3 chars, drop -r or -ar depending on dialect
                // Pitemål usually drops the 'r' or the whole suffix 'ar' -> 'a' or nothing.
                // Let's go with dropping 'r' -> 'a' as safe, or dropping 'ar' for strong apocope.
                // Your feedback: "dansar -> dans"
                if (useVerbs && word.endsWith("ar") && word.length > 3) {
                     // Check if it's likely a verb (heuristic)
                     word = word.slice(0, -2); // Drop 'ar' completely
                     appliedRule = "Verb Apocope (-ar)";
                }

                // C. Suffixes
                if (useSuffixes) {
                    for (let rule of suffixRules) {
                        if (word.endsWith(rule.suffix)) {
                            // Check if word is long enough to have a suffix
                            if (word.length > rule.suffix.length + 2) { 
                                word = word.slice(0, -rule.suffix.length) + rule.replace;
                                appliedRule = rule.name;
                                break;
                            }
                        }
                    }
                }

                // D. Phonology (General Rules)
                if (usePhono) {
                    for (let rule of phonologyRules) {
                        if (word.match(rule.regex)) {
                            word = word.replace(rule.regex, rule.replace);
                            if (appliedRule === "Raw") appliedRule = rule.name;
                        }
                    }
                }
                
                // E. General Apocope (Final -a drop)
                // Pitemål famously drops final -a in many nouns and infinitives
                // pratar -> prata -> prat
                if (word.endsWith('a') && word.length > 3) {
                    // Check if we haven't already apocoped a verb
                    if (!appliedRule.includes("Apocope")) {
                        word = word.slice(0, -1);
                        appliedRule += " + Final Apocope";
                    }
                }
            }

            // Restore capitalization
            if (original[0] === original[0].toUpperCase()) {
                word = word.charAt(0).toUpperCase() + word.slice(1);
            }

            if (original.toLowerCase() !== word.toLowerCase()) {
                log(original, word, appliedRule);
            }

            return word;
        });

        outputField.value = processedTokens.join('');
    }
</script>

</body>
</html>
