<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bondska Dialect Translator</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --primary-color: #2a2a2a;
            --secondary-color: #3a3a3a;
            --text-color: #e0e0e0;
            --accent-color: #00aaff;
            --border-color: #4a4a4a;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .translator-container { width: 90%; max-width: 900px; background: var(--primary-color); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); overflow: hidden; }
        header { background: var(--secondary-color); padding: 20px; text-align: center; border-bottom: 1px solid var(--border-color); }
        header h1 { margin: 0; font-size: 24px; color: var(--accent-color); }
        header p { margin: 5px 0 0; color: #aaa; }
        main { padding: 25px; }
        .io-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .io-box textarea { width: 100%; height: 200px; background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; font-size: 16px; resize: none; }
        .io-box h2 { margin-top: 0; font-size: 18px; color: #ccc; }
        #output-box { background: var(--bg-color); border-radius: 8px; padding: 15px; min-height: 200px; font-size: 16px; border: 1px solid var(--border-color); white-space: pre-wrap; }
        .controls { padding: 20px; background: var(--secondary-color); border-top: 1px solid var(--border-color); text-align: center; }
        fieldset { border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 15px; margin: 0; }
        legend { color: var(--accent-color); font-weight: bold; }
    </style>
</head>
<body>
    <div class="translator-container">
        <header>
            <h1>Swedish ↔ Bondska Translator</h1>
            <p>An authentic Westrobothnian (Pitemål) dialect engine</p>
        </header>
        <main>
            <div class="io-grid">
                <div class="io-box">
                    <h2>Standard Swedish</h2>
                    <textarea id="swedish-input" placeholder="Skriv svenska här..." oninput="runTranslation()"></textarea>
                </div>
                <div class="io-box">
                    <h2>Bondska (Pitemål)</h2>
                    <div id="output-box"></div>
                </div>
            </div>
        </main>
        <div class="controls">
            <fieldset>
                <legend>Dialect Strictness</legend>
                <label><input type="radio" name="strictness" value="1"> Swedified (Simple)</label>
                <label><input type="radio" name="strictness" value="2" checked> Full Bondska (Authentic)</label>
            </fieldset>
        </div>
    </div>

    <script>
        const dictionary = {
            "jag": "i", "är": "jär", "ha": "ha", "har": "ha",
            "vi": "vä", "är": "våra", "ha": "håva", // Plural forms
            "du": "dö", "han": "han", "hon": "ho", "den": "he", "det": "he",
            "de": "döm",
            "inte": "et", "vad": "vo", "var": "vors", "hur": "vöre",
            "kasta": "kaast", "bakar": "båka", "pratar": "pråta",
            "bok": "båok", "hus": "heus", "hand": "hann", "man": "kar",
            "skogen": "skåogen", "bordet": "båoLe"
        };

        const verbPluralEndings = { "ar": "a", "er": "a" };

        function isPlural(subject) {
            return ["vä", "ni", "döm"].includes(subject.toLowerCase());
        }

        function translateFullBondska(tokens) {
            let translated = [];
            for (let i = 0; i < tokens.length; i++) {
                let token = tokens[i];
                if (dictionary[token]) {
                    translated.push(dictionary[token]);
                    continue;
                }

                // Grammatical rule: Plural verb forms
                if (i > 0 && isPlural(translated[i-1])) {
                    for (const [sv, bo] of Object.entries(verbPluralEndings)) {
                        if (token.endsWith(sv)) {
                            token = token.slice(0, -sv.length) + bo;
                            break;
                        }
                    }
                }
                
                // Phonetic rule: Apocope (simplified)
                if (token.endsWith('a')) {
                    token = token.slice(0, -1);
                }

                translated.push(token);
            }
            return translated;
        }

        function translateSwedified(tokens) {
            return tokens.map(token => dictionary[token] || token.replace(/a/g, 'å').replace(/e/g, 'ä'));
        }

        function runTranslation() {
            const input = document.getElementById("swedish-input").value.toLowerCase();
            const strictness = document.querySelector('input[name="strictness"]:checked').value;
            const tokens = input.split(/(\s+|[.,!?-])/).filter(Boolean);

            let outputTokens;
            if (strictness === '2') {
                outputTokens = translateFullBondska(tokens);
            } else {
                outputTokens = translateSwedified(tokens);
            }

            document.getElementById('output-box').textContent = outputTokens.join('');
        }
    </script>
</body>
</html>
